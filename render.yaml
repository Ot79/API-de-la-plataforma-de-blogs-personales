# Blueprint de Render: crea la API y su base de datos PostgreSQL.
# Dashboard de Render → New → Blueprint → selecciona este repositorio.
services:
  - type: web
    name: blogging-platform-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --include=dev: NODE_ENV=production también aplica al build y tsup/prisma son devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    # Las migraciones se aplican en cada arranque (idempotente) antes de servir tráfico.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blogging-platform-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '7'
      - key: CORS_ORIGIN
        value: '*'
      - key: LOG_LEVEL
        value: info

databases:
  - name: blogging-platform-db
    plan: free
    region: frankfurt
    databaseName: blog
    user: blog
    postgresMajorVersion: '16'
    ipAllowList: [] # Solo accesible desde servicios de Render
